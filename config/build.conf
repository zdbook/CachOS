# CachyOS Server x86-64-v4 Build Configuration
# 
# This file contains optimization parameters for the kernel build
# Server-optimized settings for x86-64-v4 architecture

[build]
# Architecture optimization for x86-64-v4 with AVX-512
processor_opt = GENERIC_V4
use_auto_optimization = no

[scheduler]
# EEVDF scheduler - good balance for servers
cpu_scheduler = eevdf

[kernel_timers]
# 100Hz for server workloads (lower context switching overhead)
hz_ticks = 100
# Full tickless kernel for power efficiency
tickrate = full
# Full preemption for balanced latency/throughput
preemption = full

[compilation]
# Enhanced compiler optimizations
cc_harder = yes
# Performance governor as default
per_gov = yes
# Use Thin LTO for Clang builds (auto-disabled for GCC)
use_llvm_lto = thin

[networking]
# TCP BBR3 for improved congestion control
tcp_bbr3 = yes

[features]
# ZFS filesystem support
build_zfs = yes
# NVIDIA open-source driver support
build_nvidia_open = yes
# r8125 network driver (Realtek RTL8125)
build_r8125 = yes
# CachyOS configuration (server-optimized)
cachy_config = yes

[security]
# kCFI only for Clang builds
use_kcfi = no

[optimization_notes]
# x86-64-v4 includes these ISA extensions over x86-64:
# - AVX-512 Foundation (AVX512F)
# - AVX-512 Doubleword and Quadword (AVX512DW)
# - AVX-512 Byte and Word (AVX512BW)
# - AVX-512 Vector Length Extensions (AVX512VL)
# - AVX-512 Conflict Detection (AVX512CD)
# 
# These extensions provide significant performance improvements for:
# - Scientific computing
# - Data processing
# - Cryptography
# - Machine learning
# - Database operations
